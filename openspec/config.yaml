context: |
  Project: terraform-provider-revenuecat - a Terraform provider for RevenueCat.
  Tech stack: Go 1.24, terraform-plugin-framework (not SDKv2), terraform-plugin-testing.
  Target API: RevenueCat REST API v2 (https://api.revenuecat.com/v2), Bearer auth with a
  v2 secret API key. Objects: projects, apps, products, entitlements, offerings, packages,
  plus attach/detach actions between entitlements<->products and packages<->products.
  Layout convention: internal/revenuecat (API client), internal/provider (provider,
  resources, data sources), examples/, docs/.
  Constraint: the session network blocks revenuecat.com, so the API contract is encoded
  from documented knowledge and must be isolated behind a client package that can be
  corrected in one place. All tests run against an httptest fake, never the live API.
