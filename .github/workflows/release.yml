name: Release

# One workflow, not two: a tag pushed by a workflow using the default GITHUB_TOKEN does not
# trigger other workflows (GitHub's anti-recursion protection), so a separate tag-then-release
# pair never fires the release half. Tagging and releasing happen in the same job instead, so
# there is no cross-workflow trigger to rely on. Every merge to main is a release.
on:
  push:
    branches: [main]
  # For re-cutting a release without an unrelated commit — e.g. after rotating the signing key.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - uses: gittools/actions/gitversion/execute@v3
        id: gitversion
        with:
          useConfigFile: true

      - name: Tag
        env:
          VERSION: v${{ steps.gitversion.outputs.semVer }}
        run: |
          set -euo pipefail
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, nothing to release."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - uses: actions/setup-go@v5
        if: env.skip != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Import GPG key
        if: env.skip != 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - uses: goreleaser/goreleaser-action@v6
        if: env.skip != 'true'
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
