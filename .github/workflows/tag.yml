name: Tag release

# Every merge to main gets its own version tag, which release.yml then picks up to publish the
# provider automatically — merging is the only action needed to ship a release. GitVersion's
# MainLine mode (GitVersion.yml) derives that version from history, same convention as MergeTap's
# own pipeline.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - uses: gittools/actions/gitversion/execute@v3
        id: gitversion
        with:
          useConfigFile: true

      - name: Tag and push
        env:
          VERSION: v${{ steps.gitversion.outputs.semVer }}
        run: |
          set -euo pipefail
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
